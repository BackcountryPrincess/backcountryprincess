name: Schedule Casual Misconduct 60 Posts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schedule-casual-misconduct-60.yml"
      - "facebook-assets/casual-misconduct/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: schedule-casual-misconduct-60
  cancel-in-progress: false

jobs:
  schedule-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      QUEUE_B64: 
    steps:
      - name: Check out stable Facebook assets
        uses: actions/checkout@v4

      - name: Schedule and verify Casual Misconduct queue
        id: schedule
        shell: node {0}
        run: |
          const fs = require("fs");
          const crypto = require("crypto");
          
          const GRAPH_VERSION = "v21.0";
          const GRAPH = "https://graph.facebook.com/" + GRAPH_VERSION;
          const PAGE_NAME = "Casual Misconduct";
          const BLOCKED = new Set(["BackcountryPrincess", "Backcountry Princess"]);
          const FOLDER_ID = "16kWUqaFEYnNrl71srcVmNBSlpkVIjpOS";
          const queue = JSON.parse(Buffer.from(process.env.QUEUE_B64, "base64").toString("utf8"));
          const userToken = process.env.FB_ACCESS_TOKEN;
          const ASSET_DIR = "facebook-assets/casual-misconduct";
          
          async function json(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.error) {
              const graphError = body.error || {};
              throw new Error([
                graphError.message || ("HTTP " + response.status),
                graphError.code != null ? "code=" + graphError.code : "",
                graphError.error_subcode != null ? "subcode=" + graphError.error_subcode : "",
                graphError.type ? "type=" + graphError.type : "",
                graphError.fbtrace_id ? "trace=" + graphError.fbtrace_id : ""
              ].filter(Boolean).join("; "));
            }
            return body;
          }
          function graphUrl(endpoint, token, query = {}) {
            const url = new URL(GRAPH + "/" + endpoint.replace(/^\//, ""));
            Object.entries(query).forEach(([key, value]) => url.searchParams.set(key, String(value)));
            url.searchParams.set("access_token", token);
            return url;
          }
          async function allPages(url) {
            const rows = [];
            let next = url;
            while (next) {
              const body = await json(next);
              rows.push(...(body.data || []));
              next = body.paging && body.paging.next;
            }
            return rows;
          }
          
          async function main() {
          if (!userToken) throw new Error("FB_ACCESS_TOKEN is not configured");
          if (queue.length !== 60) throw new Error("Queue must contain exactly 60 posts");
          for (const key of ["id", "asset", "caption", "scheduledAt"]) {
            if (new Set(queue.map(item => item[key])).size !== 60) throw new Error("Duplicate queue " + key);
          }
          if (queue[0].scheduledAt !== "2026-08-22T12:15:00-04:00" || queue[59].scheduledAt !== "2026-09-20T20:15:00-04:00") {
            throw new Error("Approved date window mismatch");
          }
          
          const accounts = await json(graphUrl("me/accounts", userToken, {fields: "id,name,access_token,tasks", limit: 100}));
          const matches = (accounts.data || []).filter(page => page.name === PAGE_NAME);
          if (matches.length !== 1) throw new Error("Expected exactly one accessible Casual Misconduct Page; found " + matches.length);
          const page = matches[0];
          if (BLOCKED.has(page.name)) throw new Error("Blocked destination selected");
          if (!page.access_token) throw new Error("Meta did not return a Casual Misconduct Page token");
          const pageToken = page.access_token;
          const identity = await json(graphUrl(page.id, pageToken, {fields: "id,name"}));
          if (identity.id !== page.id || identity.name !== PAGE_NAME) throw new Error("Page identity mismatch");
          
          const missingAssets = queue.filter(item => !fs.existsSync(ASSET_DIR + "/" + item.asset)).map(item => item.asset);
          if (missingAssets.length) throw new Error("Repository assets missing: " + missingAssets.join(", "));
          
          const since = Math.floor((Date.now() - 14 * 86400000) / 1000);
          const [recent, scheduledBefore] = await Promise.all([
            allPages(graphUrl(page.id + "/posts", pageToken, {fields: "id,message,created_time", since, limit: 100})),
            allPages(graphUrl(page.id + "/scheduled_posts", pageToken, {fields: "id,message,scheduled_publish_time", limit: 100}))
          ]);
          const existingMessages = new Map();
          for (const post of [...recent, ...scheduledBefore]) if (post.message) existingMessages.set(post.message.trim(), post.id);
          
          const records = [];
          for (const item of queue) {
            const existingId = existingMessages.get(item.caption.trim());
            if (existingId) {
              records.push({...item, status: "already-present", metaPostId: existingId});
              console.log("Already present " + item.id + "/60: " + existingId);
              continue;
            }
            const bytes = fs.readFileSync(ASSET_DIR + "/" + item.asset);
            const form = new FormData();
            form.set("source", new Blob([bytes], {type: "image/png"}), item.asset);
            form.set("message", item.caption);
            form.set("published", "false");
            form.set("scheduled_publish_time", String(Math.floor(new Date(item.scheduledAt).valueOf() / 1000)));
            form.set("access_token", pageToken);
            const result = await json(GRAPH + "/" + page.id + "/photos", {method: "POST", body: form});
            const postId = result.post_id || result.id;
            if (!postId) throw new Error("Meta returned no post ID for queue item " + item.id);
            records.push({...item, status: "scheduled", metaPostId: postId});
            existingMessages.set(item.caption.trim(), postId);
            console.log("Scheduled " + item.id + "/60: " + postId);
          }
          
          const scheduledAfter = await allPages(graphUrl(page.id + "/scheduled_posts", pageToken, {fields: "id,message,scheduled_publish_time", limit: 100}));
          const afterMessages = new Set(scheduledAfter.map(post => (post.message || "").trim()));
          const unverified = queue.filter(item => !afterMessages.has(item.caption.trim()));
          if (unverified.length) throw new Error("Facebook verification missing queue items: " + unverified.map(item => item.id).join(", "));
          
          const proof = {verifiedAt: new Date().toISOString(), page: identity, folderId: FOLDER_ID, count: records.length, newlyScheduled: records.filter(x => x.status === "scheduled").length, alreadyPresent: records.filter(x => x.status === "already-present").length, records};
          fs.mkdirSync("proof", {recursive: true});
          fs.writeFileSync("proof/casual-misconduct-60-post-proof.json", JSON.stringify(proof, null, 2));
          const summary = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(summary, "# Casual Misconduct Facebook queue verified\n\n");
          fs.appendFileSync(summary, "Page: **" + identity.name + "** (" + identity.id + ")\n\n");
          fs.appendFileSync(summary, "Verified posts: **60/60**; newly scheduled: **" + proof.newlyScheduled + "**; already present: **" + proof.alreadyPresent + "**.\n\n");
          fs.appendFileSync(summary, "Window: **2026-08-22 12:15 ET** through **2026-09-20 20:15 ET**.\n\n");
          fs.appendFileSync(summary, "| # | Time (ET) | Asset | Status | Meta ID |\n|---:|---|---|---|---|\n");
          for (const record of records) fs.appendFileSync(summary, "| " + record.id + " | " + record.scheduledAt + " | " + record.asset + " | " + record.status + " | " + record.metaPostId + " |\n");
          }
          
          main().catch(error => {
            fs.mkdirSync("proof", {recursive: true});
            fs.writeFileSync("proof/error.txt", error.stack || String(error));
            console.error(error);
            process.exitCode = 1;
          });
      - name: Upload scheduling proof
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: casual-misconduct-60-post-proof
          path: proof/
          if-no-files-found: warn
      - name: Record Facebook queue result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SCHEDULE_OUTCOME: ${{ steps.schedule.outcome }}
        shell: bash
        run: |
          state=failure
          description="Casual Misconduct queue scheduling failed"
          context="facebook-queue/casual-misconduct-60"
          if [ "$SCHEDULE_OUTCOME" = "success" ]; then
            state=success
            description="Facebook returned all 60 Casual Misconduct scheduled posts"
          elif [ -f proof/error.txt ]; then
            error_text=$(cat proof/error.txt)
            case "$error_text" in
              *GOOGLE_DRIVE_ACCESS_TOKEN*) context="$context/missing-drive-token" ;;
              *FB_ACCESS_TOKEN*) context="$context/missing-meta-token" ;;
              *"Expected exactly one accessible"*) context="$context/page-resolution" ;;
              *"Duplicate image bytes"*) context="$context/duplicate-assets" ;;
              *"Drive is missing queue assets"*) context="$context/missing-assets" ;;
              *"SyntaxError"*) context="$context/runner-syntax" ;;
              *) slug=$(head -n1 proof/error.txt | tr "[:upper:]" "[:lower:]" | sed "s/[^a-z0-9]/-/g;s/-\\{2,\\}/-/g;s/^-//;s/-$//" | cut -c1-55); context="$context/${slug:-runtime-error}" ;;
            esac
          fi
          jq -n --arg state "$state" --arg context "$context" --arg description "$description"             '{state:$state,context:$context,description:$description}' > status.json
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA"             --data @status.json
