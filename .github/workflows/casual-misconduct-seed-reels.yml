# unapproved Seed Reels directly to Facebook and Instagram. Do not re-enable
# scheduling or publishing until Jenn has approved the plan, captions,
# destination, timing, and exact assets.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Disabled placeholder only. This workflow does not publish."
        required: false
        type: string

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Publishing disabled
        run: |
          echo "Casual Misconduct seed Reel automation is disabled."
          echo "No Facebook or Instagram publishing occurs from this workflow."
